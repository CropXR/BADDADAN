experiment_data:
  name: '500 clusters'
  description: "Doing 500 clusters from atted II, then selecting top 20 clusters and 
                merging highly correlated modules here.
                Trying to see if I can fit it into this framework.
                "
  summary_of_result: "If you keep the edge_corr_threshold at 0.3, you get an error during 
  the intermodular network inference at the metacluster_step. Previously I fixed this by 
  raising the threshold to 0.4 for this step. But of course that is a bit weird, so in the next experiment 
  I try to keep the threshold at .4 all the time.
  "
data:
  soft_path: 'data/raw_data/expression_datasets/gse65046/GSE65046_family.soft'
  linkage_path: 'data/preprocessed_data/atted_ii/linkage_matrices/all_cor_one_matrix_renamed_complete_linkage.npy'
  atted_path: 'data/raw_data/atted_ii/all_cor_one_matrix_renamed.csv'
  metabolite_path: 'data/raw_data/expression_datasets/gse65046/plcell_v28_2_345_s1/TPC2015-00910-LSBR1_Supplemental_Data_sets_1_18.xlsx'
  tf2_in_name: '01_tf2_input.txt'
  tf2_out_name: '02_tf2_output.txt'
  new_tf2_in_name: '03_new_tf2_input.txt'
  new_tf2_out_name: '04_new_tf2_output.txt'
hyperparams:
  do_local_clustering: False
  do_atted_ii_clustering_of_clusters: True
  clustering_of_clusters_threshold: 0.8
  nr_clusters: 500
  agg_method: 'mean'
  edge_corr_threshold: .3
  top_nr_clusters: 20
  do_log2: True
